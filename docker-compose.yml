# ============================================================================
#  CTN 2026 — deployment orchestration
# ============================================================================
#  Common commands:
#      ./scripts/docker.sh build     # build the runtime image
#      ./scripts/docker.sh verify    # build the self-check image and run all tests
#      ./scripts/docker.sh up        # start in the background
#      ./scripts/docker.sh logs      # follow logs
#      ./scripts/docker.sh shell     # open a shell for debugging
#      ./scripts/docker.sh down      # stop
#
#  Run this once before the first deployment (otherwise the container cannot
#  write to the mounted directories):
#      mkdir -p state logs && sudo chown -R 10001:10001 state logs
#
#  ── Why compose instead of plain `docker run` ──────────────────────────
#  It makes the three-way split from the architecture *enforced*:
#      code    -> image   (from git)
#      state   -> volume  (backed up separately, cannot reach git)
#      secrets -> env_file (cannot reach the image)
#  A hand-written `docker run` easily drags .env or state/ into the image;
#  this structure prevents that by construction.
# ============================================================================

name: ctn2026

services:

  # -------------------------------------------------------------------------
  # Fleet main process
  # -------------------------------------------------------------------------
  fleet:
    build:
      context: .
      target: runtime
    image: ctn2026/fleet:${CTN_IMAGE_TAG:-local}

    # Secrets are injected from .env only; never COPYed into the image
    # (Rule 5.6). `required: false` lets `docker compose config/build` work
    # before .env exists; the real check before starting lives in
    # scripts/docker.sh (require_env).
    env_file:
      - path: .env
        required: false

    environment:
      CTN_STATE_DIR: /state
      CTN_LOG_DIR: /logs
      TZ: Australia/Sydney

    volumes:
      # State: sqlite / exposure log / checkpoints. **Back this up separately.**
      - ./state:/state
      # Telemetry JSONL: calibration fuel plus presentation material
      - ./logs:/logs

    # Two weeks unattended: if it dies, it must come back on its own
    restart: unless-stopped

    # Give model/network worker threads time to finish after SIGTERM, before
    # SIGKILL. Compared with a two-week run, a short shutdown window is
    # negligible; losing data is not.
    stop_grace_period: 120s

    # Correct signal forwarding and zombie reaping (the classic problem when
    # Python runs as PID 1)
    init: true

    # The rate-limit design needs no high throughput (~0.6 req/s per team).
    # These caps exist only to stop a bug-driven runaway loop from taking down
    # the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    command: ["python", "-m", "ctn.main"]

  # -------------------------------------------------------------------------
  # Self-check (not started by default; run on demand)
  #     docker compose --profile test run --rm verify
  #     or ./scripts/docker.sh verify
  # -------------------------------------------------------------------------
  verify:
    profiles: ["test"]
    build:
      context: .
      target: verify
    image: ctn2026/verify:${CTN_IMAGE_TAG:-local}
    # Fully offline: no .env, no network, no volumes
    network_mode: none
