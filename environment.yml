# ============================================================================
#  CTN 2026 — unified Python environment
# ============================================================================
#  Usage:
#      ./scripts/setup_env.sh            # create or update (recommended)
#      conda env create -f environment.yml
#      conda activate ctn
#
#  Why the Python version must be pinned (measured 2026-10):
#
#      The Optional unwrapping in ctn/jev/inputs.py depends on
#      `typing.Union is types.UnionType`, and that identity only holds from
#      Python 3.14 onwards (3.14 unified the two types).
#
#      Measured on the same unchanged code:
#          Python 3.14.8  -> 319/319 tests pass
#          Python 3.13.13 -> 229 failures + 130 errors
#                            (JevInput rejects every input)
#
#      The code has been fixed to accept both union flavours
#      (`origin is UnionType or origin is Union`), but the environment is still
#      pinned to 3.14: that was the one version difference we found, not
#      necessarily the only one. Do not gamble on untested version differences
#      during the competition.
# ============================================================================

name: ctn

channels:
  - conda-forge

dependencies:
  # ── Interpreter: the most important line in this file ───────────────
  - python=3.14

  - pip>=25.1

  # ── Third-party dependencies ───────────────────────────────────────
  # ctn/jev/ is currently pure standard library; the offline test suite needs
  # no third-party packages at all.
  #
  # pip dependencies are NOT listed again here — this references
  # requirements.txt, the single source of truth on the pip side (the Docker
  # image uses it too), so the two cannot drift.
  - pip:
      - -r requirements.txt

      # If it turns out that "image upload is only possible through the web UI,
      # not the API", add playwright to requirements.txt. Note that the
      # deployment shape then has to change from systemd+venv to a container,
      # and browser instances need memory reserved (150-300MB each).
