name: ci

# One job, deliberately.
#
# It builds the Dockerfile's `verify` stage, which does three things at build
# time: installs dependencies into a venv on python:3.14-slim, runs
# scripts/check_env.py (interpreter version guard), and runs the full offline
# test suite. If any of those fail, the build fails.
#
# This is the same interpreter the fleet ships on, so CI and production cannot
# drift. It also means a broken Dockerfile is caught here rather than on the
# server mid-competition.
#
# Why there is no 3.13 job: the project runs on 3.14 only. environment.yml pins
# it, the image pins it, and scripts/check_env.py refuses to start on anything
# else. The union defect in ctn/jev/inputs.py that broke 3.13 is fixed, but 3.13
# is not a supported target and is not tested.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Pinned instead of ubuntu-latest: GitHub is migrating the ubuntu-latest
    # label to Ubuntu 26 beginning 2026-10-19, the competition's first day.
    # A runner image change underneath a Docker build is not something to
    # discover mid-competition, so this stays on a fixed image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The verify stage runs the version guard and the full offline suite as part of
      # the image build, so a failing suite fails this step.
      - name: Build verify stage (3.14 + version guard + offline tests)
        run: docker build --target verify -t ctn-verify .

      - name: Build runtime stage
        run: docker build --target runtime -t ctn-runtime .

      # The default command is a continuous service. CI uses its bounded mock
      # mode without credentials, external networking, or host state volumes.
      - name: Run one offline service cycle
        timeout-minutes: 2
        run: >-
          docker run --rm --network none
          -e CTN_MODE=mock -e CTN_DRY_RUN=true -e CTN_SIDE=yes
          ctn-runtime python -m ctn.main --mock --side yes --once
